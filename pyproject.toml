[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sharepoint-retrieval-agent"
version = "0.1.0"
description = "SharePoint-only RAG agent using the Microsoft 365 Copilot Retrieval API"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Sample" }]
dependencies = [
    # agentdev 0.0.1b260427 currently requires agent-framework-core <1.3.
    "agent-framework-openai==1.1.1",
    "azure-identity>=1.25.0,<2",
    "httpx>=0.28.0,<1",
    "msal>=1.37.0,<2",
    "python-dotenv>=1.1.0,<2",
]

[project.optional-dependencies]
dev = [
    "agent-dev-cli>=0.0.1b260427",
    "agent-framework-foundry-hosting==1.0.0a260428",
    "debugpy>=1.8.0,<2",
    "mypy>=1.17.0,<2",
    "pytest>=8.4.0,<10",
    "pytest-asyncio>=1.1.0,<2",
    "ruff>=0.12.0,<1",
]

[project.scripts]
sharepoint-agent = "sharepoint_retrieval_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sharepoint_retrieval_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["sharepoint_retrieval_agent"]

[[tool.mypy.overrides]]
module = "agent_framework_foundry_hosting.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "msal.*"
ignore_missing_imports = true
